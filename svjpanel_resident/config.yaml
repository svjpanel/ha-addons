name: svjpanel resident
version: "0.2.2"
slug: svjpanel_resident
description: Share selected sensors and safe buttons of your Home Assistant with svjpanel (private use only)
url: https://github.com/svjpanel/ha-addons
arch: [aarch64, amd64]
startup: application
boot: auto
homeassistant_api: true
hassio_api: false
host_network: false
host_pid: false
host_ipc: false
privileged: []
full_access: false
apparmor: true
init: false
options:
  pairing_code: ""
  t3_declaration: false
  read_entities: []
  actions: []
schema:
  pairing_code: str?
  t3_declaration: bool
  read_entities:
    - entity_id: str
      text: bool?
      sensitive_ack: bool?
  actions:
    - entity_id: str
      service: str
      confirm_triggers_others: bool?
